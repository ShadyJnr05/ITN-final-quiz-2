  .feedback { font-size: 0.88em; margin-top: 10px; padding: 10px 14px; border-radius: 8px; display: none; }
  .feedback.correct { display: block; background: rgba(34,197,94,0.15); color: #4ade80; border-left: 4px solid #22c55e; }
  .feedback.incorrect { display: block; background: rgba(239,68,68,0.15); color: #f87171; border-left: 4px solid #ef4444; }

<script>
/* ============================================================
   QUESTION BANK (60 NEW QUESTIONS)
   ============================================================ */
const allQuestions = [
  // --- SET 1: Network Fundamentals & OSI Model ---
  { type: 'mcq', q: 'What is the PDU (Protocol Data Unit) of the Application layer?', options: {A: 'Data', B: 'Segment', C: 'Packet', D: 'Frame'}, ans: 'A', exp: 'The Application, Presentation, and Session layers deal with "Data".' },
  { type: 'mcq', q: 'Which layer of the OSI model is responsible for establishing, managing, and terminating sessions?', options: {A: 'Transport', B: 'Session', C: 'Presentation', D: 'Application'}, ans: 'B', exp: 'The Session layer (Layer 5) handles dialog control and session management.' },
  { type: 'tf', q: 'A MAC address is a logical address that can change if you move a PC to a different network.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. A MAC address is a physical address burned into the NIC. An IP address is a logical address that changes.' },
  { type: 'mcq', q: 'Which standard defines Ethernet at the Data Link and Physical layers?', options: {A: '802.11', B: '802.1Q', C: '802.3', D: '802.1X'}, ans: 'C', exp: '802.3 is Ethernet. 802.11 is Wi-Fi. 802.1Q is VLAN tagging.' },
  { type: 'short', q: 'What does MAC stand for?', ans: ['media access control'], exp: 'MAC = Media Access Control.' },
  { type: 'mcq', q: 'Which device primarily operates at Layer 2 of the OSI model?', options: {A: 'Router', B: 'Switch', C: 'Hub', D: 'Firewall'}, ans: 'B', exp: 'Switches use MAC addresses to forward frames at Layer 2.' },
  { type: 'mcq', q: 'What is the default port for SSH?', options: {A: '21', B: '22', C: '23', D: '25'}, ans: 'B', exp: 'SSH uses port 22. FTP is 21, Telnet is 23, SMTP is 25.' },
  { type: 'tf', q: 'The TCP/IP model has 7 layers, just like the OSI model.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. The TCP/IP model has 4 layers: Application, Transport, Internet, Network Access.' },
  { type: 'mcq', q: 'Which topology connects every device to every other device?', options: {A: 'Star', B: 'Mesh', C: 'Bus', D: 'Ring'}, ans: 'B', exp: 'A full mesh topology provides maximum redundancy but is expensive to cable.' },
  { type: 'short', q: 'What is the default port number for Telnet?', ans: ['23'], exp: 'Telnet uses port 23 (insecure, sends data in plaintext).' },

  // --- SET 2: IPv4 Subnetting & Addressing ---
  { type: 'mcq', q: 'What is the broadcast address for the network 172.16.5.0/24?', options: {A: '172.16.5.1', B: '172.16.5.254', C: '172.16.5.255', D: '172.16.0.255'}, ans: 'C', exp: 'A /24 leaves 8 host bits. The last address in the block (all 1s) is the broadcast (.255).' },
  { type: 'mcq', q: 'How many usable hosts are available in a /28 subnet?', options: {A: '6', B: '14', C: '30', D: '62'}, ans: 'B', exp: '/28 = 4 host bits. 2^4 = 16. Minus 2 (network & broadcast) = 14 usable hosts.' },
  { type: 'short', q: 'What is the subnet mask for a /27 prefix? (Write in dotted decimal)', ans: ['255.255.255.224'], exp: '/27 = 11111111.11111111.11111111.11100000 = 255.255.255.224.' },
  { type: 'mcq', q: 'Which IP address is a valid APIPA address?', options: {A: '10.0.0.1', B: '192.168.1.1', C: '169.254.10.50', D: '172.16.5.5'}, ans: 'C', exp: 'APIPA addresses are in the 169.254.0.0/16 range.' },
  { type: 'mcq', q: 'What is the network address for the host 192.168.10.200/26?', options: {A: '192.168.10.0', B: '192.168.10.64', C: '192.168.10.128', D: '192.168.10.192'}, ans: 'C', exp: '/26 block size is 64. Subnets: 0, 64, 128, 192. 200 falls in the 128 subnet.' },
  { type: 'mcq', q: 'What is the primary purpose of a subnet mask?', options: {A: 'To encrypt data', B: 'To identify the network and host portions of an IP', C: 'To assign MAC addresses', D: 'To connect to the internet'}, ans: 'B', exp: 'The mask tells the device which bits represent the network and which represent the host.' },
  { type: 'short', q: 'What is the last usable host address for the subnet 10.0.0.0/25?', ans: ['10.0.0.126'], exp: 'Network is .0, broadcast is .127. Last usable host is .126.' },
  { type: 'tf', q: 'A /30 subnet mask provides exactly 2 usable host addresses, making it ideal for point-to-point links.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'True. /30 leaves 2 host bits. 2^2 = 4, minus 2 = 2 usable hosts.' },
  { type: 'mcq', q: 'If you need 50 hosts on a subnet, what is the smallest subnet mask you can use?', options: {A: '/24', B: '/25', C: '/26', D: '/27'}, ans: 'C', exp: '/26 provides 62 usable hosts (2^6 - 2). /27 only provides 30.' },
  { type: 'short', q: 'What class is the IP address 190.10.10.10?', ans: ['class b', 'b'], exp: 'Class A is 1-126. Class B is 128-191. Class C is 192-223.' },

  // --- SET 3: IPv6 & MAC ---
  { type: 'mcq', q: 'What is the length of an IPv6 address?', options: {A: '32 bits', B: '64 bits', C: '128 bits', D: '256 bits'}, ans: 'C', exp: 'IPv6 uses 128-bit addresses, written as 8 groups of 4 hexadecimal digits.' },
  { type: 'mcq', q: 'Which IPv6 address is used for Loopback?', options: {A: '::', B: '::1', C: 'FE80::1', D: 'FF02::1'}, ans: 'B', exp: '::1 is the loopback address (equivalent to 127.0.0.1 in IPv4).' },
  { type: 'short', q: 'What is the uncompressed version of the IPv6 address 2001:db8::1?', ans: ['2001:0db8:0000:0000:0000:0000:0000:0001', '2001:0db8:0000:0000:0000:0000:0000:0001'], exp: 'The "::" replaces all the zero hextets. Expanding it fills them with 0000.' },
  { type: 'mcq', q: 'In the EUI-64 process, what is the FIRST step?', options: {A: 'Insert FF:FE in the middle', B: 'Flip the 7th bit', C: 'Split the MAC address in half', D: 'Add the network prefix'}, ans: 'C', exp: 'Step 1: Split the 48-bit MAC into two 24-bit halves.' },
  { type: 'mcq', q: 'During EUI-64, if the first octet of the MAC address is 00, what does it become after flipping the 7th bit?', options: {A: '01', B: '02', C: 'FF', D: '80'}, ans: 'B', exp: 'The 7th bit is the U/L bit. In 00000000, flipping the 7th bit from right (or left depending on definition) makes it 00000010 (02).' },
  { type: 'tf', q: 'SLAAC allows a host to generate its own IPv6 address without needing a DHCPv6 server.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'True. SLAAC uses Router Advertisements to get the prefix and EUI-64 for the host portion.' },
  { type: 'mcq', q: 'What message does a router send to provide the prefix for SLAAC?', options: {A: 'Router Solicitation (RS)', B: 'Neighbor Advertisement (NA)', C: 'Router Advertisement (RA)', D: 'Echo Request'}, ans: 'C', exp: 'The Router Advertisement (RA) carries the network prefix. (RS is sent by the host to ask for it).' },
  { type: 'short', q: 'What does the "U/L" bit stand for in a MAC address?', ans: ['universal/local', 'universal or local'], exp: 'Universal/Local bit. It indicates if the address is universally administered (OUI) or locally administered.' },
  { type: 'mcq', q: 'How many bits are in a MAC address?', options: {A: '32 bits', B: '48 bits', C: '64 bits', D: '128 bits'}, ans: 'B', exp: 'MAC addresses are 48 bits long (6 bytes), written in hexadecimal.' },
  { type: 'short', q: 'What is the IPv6 multicast address that reaches all nodes on the local link?', ans: ['ff02::1'], exp: 'FF02::1 is the all-nodes multicast address. FF02::2 is all-routers.' },

  // --- SET 4: SRWE Modules 1-2 (Switching) ---
  { type: 'mcq', q: 'When a switch receives a frame, which address does it look at to LEARN the MAC address?', options: {A: 'Source MAC', B: 'Destination MAC', C: 'Source IP', D: 'Destination IP'}, ans: 'A', exp: 'The switch learns by looking at the SOURCE MAC of incoming frames and mapping it to the ingress port.' },
  { type: 'mcq', q: 'What happens if a switch receives a frame with a destination MAC address of FF:FF:FF:FF:FF:FF?', options: {A: 'It drops the frame', B: 'It forwards it to the router', C: 'It floods the frame out all ports except the ingress', D: 'It sends it back to the source'}, ans: 'C', exp: 'FF:FF:FF:FF:FF:FF is the broadcast address. Switches flood broadcasts out all ports except the one they arrived on.' },
  { type: 'short', q: 'What is the default aging time for a dynamic MAC address entry on a Cisco switch? (Include unit)', ans: ['300 seconds', '300s', '5 minutes', '5 mins'], exp: 'By default, dynamic MAC entries are cleared after 300 seconds (5 minutes) of inactivity.' },
  { type: 'tf', q: 'Cut-through switching checks the Frame Check Sequence (FCS) before forwarding the frame.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. Cut-through forwards immediately after reading the destination MAC. Store-and-forward checks the FCS.' },
  { type: 'mcq', q: 'Which type of switching method waits to receive the entire frame before forwarding it?', options: {A: 'Cut-through', B: 'Fast-forward', C: 'Fragment-free', D: 'Store-and-forward'}, ans: 'D', exp: 'Store-and-forward receives the whole frame, checks the FCS for errors, and then forwards it.' },
  { type: 'mcq', q: 'What is a runt frame?', options: {A: 'A frame larger than 1518 bytes', B: 'A frame smaller than 64 bytes', C: 'A frame with a bad FCS', D: 'A frame with a broadcast address'}, ans: 'B', exp: 'A runt is an Ethernet frame smaller than the 64-byte minimum.' },
  { type: 'mcq', q: 'How many collision domains exist on a 24-port switch by default?', options: {A: '1', B: '12', C: '24', D: '48'}, ans: 'C', exp: 'Every single port on a switch is its own collision domain (24 ports = 24 collision domains).' },
  { type: 'tf', q: 'A hub creates a separate collision domain for every port.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. A hub has ONE collision domain for all ports. Switches create separate collision domains.' },
  { type: 'short', q: 'What command clears dynamic MAC addresses from the MAC address table?', ans: ['clear mac address-table dynamic'], exp: 'The command is "clear mac address-table dynamic".' },
  { type: 'mcq', q: 'Which frame type is destined for a single specific MAC address?', options: {A: 'Broadcast', B: 'Multicast', C: 'Unicast', D: 'Anycast'}, ans: 'C', exp: 'Unicast is one-to-one. Multicast is one-to-many. Broadcast is one-to-all.' },

  // --- SET 5: SRWE Module 3 (VLANs) ---
  { type: 'mcq', q: 'What is the primary purpose of a VLAN?', options: {A: 'To increase internet speed', B: 'To logically group devices and reduce broadcast domains', C: 'To encrypt traffic', D: 'To replace routers'}, ans: 'B', exp: 'VLANs logically segment a switch into multiple broadcast domains, improving performance and security.' },
  { type: 'mcq', q: 'Which port type carries traffic for a single VLAN and connects to end devices?', options: {A: 'Access port', B: 'Trunk port', C: 'Hybrid port', D: 'Routed port'}, ans: 'A', exp: 'Access ports belong to one VLAN and connect to PCs, printers, etc.' },
  { type: 'short', q: 'What is the default Native VLAN on a Cisco switch?', ans: ['vlan 1', '1'], exp: 'By default, all ports are in VLAN 1, which is also the Native VLAN on trunk links.' },
  { type: 'tf', q: 'A trunk port sends frames for multiple VLANs over a single link using 802.1Q tagging.', options: {A: 'True', B: 'False'}, ans: 'A', exp: 'True. Trunks use 802.1Q to tag frames so the receiving switch knows which VLAN the frame belongs to.' },
  { type: 'mcq', q: 'Which VLAN is used for IP phones to ensure voice traffic gets priority?', options: {A: 'Data VLAN', B: 'Management VLAN', C: 'Voice VLAN', D: 'Native VLAN'}, ans: 'C', exp: 'The Voice VLAN isolates VoIP traffic and applies QoS (Quality of Service) for clear calls.' },
  { type: 'mcq', q: 'What happens if the Native VLAN is mismatched on two ends of a trunk link?', options: {A: 'The trunk shuts down', B: 'Traffic on the native VLAN is dropped', C: 'The router reboots', D: 'All VLANs stop working'}, ans: 'B', exp: 'A native VLAN mismatch causes a VLAN hopping vulnerability and frames from that VLAN will not be forwarded correctly.' },
  { type: 'short', q: 'What command assigns an access port to VLAN 20?', ans: ['switchport access vlan 20'], exp: 'You must enter interface config mode and type "switchport access vlan 20".' },
  { type: 'mcq', q: 'Which VLAN is used specifically for remote management (SSH, Telnet) of a switch?', options: {A: 'Voice VLAN', B: 'Data VLAN', C: 'Management VLAN', D: 'Blackhole VLAN'}, ans: 'C', exp: 'The Management VLAN is configured with an SVI so admins can SSH into the switch securely.' },
  { type: 'tf', q: 'VLAN 1 can be deleted from a Cisco switch.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. VLAN 1 (along with 1002-1005) are default VLANs and cannot be deleted.' },
  { type: 'mcq', q: 'What is the purpose of the "switchport mode trunk" command?', options: {A: 'It sets the port to access mode', B: 'It manually forces the port to become a trunk', C: 'It enables DTP negotiation', D: 'It assigns a native VLAN'}, ans: 'B', exp: 'This command hardcodes the port as a trunk, bypassing DTP negotiation.' },

  // --- SET 6: SRWE Module 4 (Inter-VLAN) & Transport ---
  { type: 'mcq', q: 'Which inter-VLAN routing method uses subinterfaces on a single physical router interface?', options: {A: 'Legacy routing', B: 'Router-on-a-stick', C: 'SVI routing', D: 'Multilayer switching'}, ans: 'B', exp: 'Router-on-a-stick uses virtual subinterfaces (e.g., g0/0/1.10) on one physical link.' },
  { type: 'short', q: 'What command creates a subinterface for VLAN 30 on interface G0/0/0?', ans: ['interface g0/0/0.30', 'int g0/0/0.30', 'interface gi0/0/0.30'], exp: 'You append the VLAN ID to the physical interface name (e.g., G0/0/0.30).' },
  { type: 'mcq', q: 'What is the main advantage of using a Layer 3 switch for inter-VLAN routing over a router?', options: {A: 'It is cheaper', B: 'It provides hardware-based routing (faster)', C: 'It uses more cables', D: 'It supports fewer VLANs'}, ans: 'B', exp: 'Layer 3 switches use ASICs to route internally at wire speed, avoiding the router bottleneck.' },
  { type: 'mcq', q: 'Which TCP mechanism ensures reliable delivery by requiring the receiver to acknowledge data?', options: {A: 'Windowing', B: 'Checksum', C: 'ACKs (Acknowledgments)', D: 'Port numbers'}, ans: 'C', exp: 'TCP uses ACKs. If the sender doesn’t get an ACK, it retransmits the lost data.' },
  { type: 'short', q: 'What are the three steps of the TCP handshake in order?', ans: ['syn, syn-ack, ack', 'syn, syn ack, ack'], exp: 'SYN -> SYN-ACK -> ACK.' },
  { type: 'mcq', q: 'Which field in the TCP header prevents a receiver from being overwhelmed by fast senders?', options: {A: 'Sequence Number', B: 'Window Size', C: 'Urgent Pointer', D: 'Checksum'}, ans: 'B', exp: 'The Window Size field is used for flow control, telling the sender how much data can be accepted.' },
  { type: 'tf', q: 'UDP is considered a reliable protocol because it guarantees delivery of packets.', options: {A: 'True', B: 'False'}, ans: 'B', exp: 'False. UDP is unreliable (best-effort). It does not guarantee delivery, ordering, or error recovery.' },
  { type: 'mcq', q: 'What is the port number for DNS?', options: {A: '80', B: '443', C: '53', D: '67'}, ans: 'C', exp: 'DNS uses port 53 (UDP for queries, TCP for zone transfers).' },
  { type: 'mcq', q: 'If a network is divided into two subnets (one for 20 hosts, one for 60 hosts) using VLSM, which masks are used?', options: {A: '/27 and /26', B: '/28 and /27', C: '/29 and /28', D: '/26 and /25'}, ans: 'A', exp: '/27 = 30 usable hosts (fits 20). /26 = 62 usable hosts (fits 60).' },
  { type: 'short', q: 'What protocol translates domain names to IP addresses?', ans: ['dns', 'domain name system'], exp: 'DNS translates human-readable names (google.com) to IP addresses.' }
];

/* ============================================================
   APPLICATION LOGIC
   ============================================================ */
let currentSet = 0;
let score = 0;
const totalSets = allQuestions.length / 10;
const questionsPerSet = 10;

function renderSet() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  
  const startIdx = currentSet * questionsPerSet;
  const endIdx = startIdx + questionsPerSet;
  const setQuestions = allQuestions.slice(startIdx, endIdx);

  setQuestions.forEach((q, index) => {
    const globalIndex = startIdx + index + 1;
    const div = document.createElement('div');
    div.className = 'question';
    div.id = `q-${startIdx + index}`;
    
    let inputHTML = '';
    if (q.type === 'mcq' || q.type === 'tf') {
      inputHTML = '<div class="options">';
      Object.entries(q.options).forEach(([key, val]) => {
        inputHTML += `<label><input type="radio" name="q_${startIdx + index}" value="${key}"> <span><strong>${key})</strong> ${val}</span></label>`;
      });
      inputHTML += '</div>';
    } else if (q.type === 'short') {
      inputHTML = `<div class="short-answer"><input type="text" id="short-${startIdx + index}" placeholder="Type your answer here..."></div>`;
    }

    div.innerHTML = `
      <div class="q-text">${globalIndex}. ${q.q}</div>
      ${inputHTML}
      <div class="feedback" id="fb-${startIdx + index}"></div>
    `;
    container.appendChild(div);
  });

  // Add highlight effect for selections
  document.querySelectorAll('.options input').forEach(inp => {
    inp.addEventListener('change', function() {
      document.querySelectorAll(`input[name="${this.name}"]`).forEach(other => {
        other.closest('label').classList.toggle('selected', other.checked);
      });
    });
  });

  // Update UI
  document.getElementById('pageDisplay').textContent = currentSet + 1;
  document.getElementById('progressText').textContent = `Progress: ${startIdx} / ${allQuestions.length}`;
  
  document.getElementById('submitBtn').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitSet() {
  const startIdx = currentSet * questionsPerSet;
  const endIdx = startIdx + questionsPerSet;
  const setQuestions = allQuestions.slice(startIdx, endIdx);
  let setScore = 0;

  setQuestions.forEach((q, index) => {
    const qIndex = startIdx + index;
    const fb = document.getElementById(`fb-${qIndex}`);
    let isCorrect = false;
    let userAnswer = '';
    let correctAnswerText = '';

    if (q.type === 'mcq' || q.type === 'tf') {
      const sel = document.querySelector(`input[name="q_${qIndex}"]:checked`);
      if (sel) {
        userAnswer = sel.value;
        if (userAnswer === q.ans) isCorrect = true;
      }
      correctAnswerText = `${q.ans}) ${q.options[q.ans]}`;
    } else if (q.type === 'short') {
      const inp = document.getElementById(`short-${qIndex}`);
      userAnswer = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
      if (q.ans.some(a => a.toLowerCase() === userAnswer)) isCorrect = true;
      correctAnswerText = q.ans[0].toUpperCase();
    }

    if (isCorrect) {
      setScore++;
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>✅ Correct!</strong> ${q.exp}`;
    } else {
      fb.className = 'feedback incorrect';
      fb.innerHTML = `<span class="answer">❌ Incorrect. Correct Answer: ${correctAnswerText}</span> ${q.exp}`;
    }
  });

  score += setScore;
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('submitBtn').style.display = 'none';
  
  const modal = document.getElementById('resultModal');
  const modalScore = document.getElementById('modalScore');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMessage');
  const modalBtn = modal.querySelector('.btn-next');

  modalScore.textContent = `${setScore} / 10`;
  
  if (currentSet === totalSets - 1) {
    modalTitle.textContent = '🎉 Final Exam Prep 3 Complete!';
    modalScore.textContent = `${score} / ${allQuestions.length}`;
    modalMsg.textContent = 'You have completed all 60 questions. Review the feedback above!';
    modalBtn.textContent = 'Restart Quiz';
    modalBtn.onclick = () => location.reload();
  } else {
    modalTitle.textContent = `Set ${currentSet + 1} Complete!`;
    modalMsg.textContent = setScore >= 7 ? 'Excellent work! Keep it up.' : 'Review the explanations below and try to improve on the next set.';
    modalBtn.textContent = 'Continue to Next Set';
    modalBtn.onclick = closeModalAndNext;
  }

  modal.classList.add('show');
}

function closeModalAndNext() {
  document.getElementById('resultModal').classList.remove('show');
  currentSet++;
  renderSet();
}

// Initialize
renderSet();
</script>
